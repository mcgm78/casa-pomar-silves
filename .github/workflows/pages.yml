name: Publicar Casa Pomar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter os ficheiros
        uses: actions/checkout@v4
      - name: Gerar português, inglês, alemão e francês
        run: python3 .github/build-languages.py
      - name: Preparar o site e todas as imagens
        run: |
          sha256sum --check media.sha256
          mkdir _site
          cp index.html en.html de.html fr.html styles.css property.js i18n.js app.js tour.js tour-data.js favicon.svg sitemap.xml _site/
          python3 - <<'PYTHON'
          import glob, zipfile
          for archive in sorted(glob.glob('media-*.zip')):
              with zipfile.ZipFile(archive) as package:
                  package.extractall('_site')
          PYTHON
          touch _site/.nojekyll
      - name: Verificar fotografias, visita virtual e contactos
        run: |
          node .github/verify-site.mjs _site
          node .github/verify-languages.mjs _site
      - name: Publicar apenas as versões otimizadas das fotografias
        run: rm -rf _site/images/original
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar os ficheiros para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
